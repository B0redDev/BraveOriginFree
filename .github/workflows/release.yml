name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Brave Origin version (X.Y.Z) or "latest"'
        required: true
        default: 'latest'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION_INPUT: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch verified Brave Origin
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:VERSION_INPUT
          if (-not $v) { $v = 'latest' }
          if ($v -notmatch '^(latest|\d+\.\d+\.\d+)$') { Write-Host "Invalid version '$v'"; exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File src\update.ps1 -Version $v
          if ($LASTEXITCODE -ne 0) { Write-Host "update.ps1 failed ($LASTEXITCODE)"; exit 1 }

      - name: Package
        shell: powershell
        run: |
          $zip = powershell.exe -NoProfile -ExecutionPolicy Bypass -File src\package.ps1 | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or -not $zip) { Write-Host 'package.ps1 failed'; exit 1 }
          . .\src\runtime.ps1
          $v = Get-BraveVersion (Join-Path $PWD 'bin\brave.exe')
          "PACKAGE_PATH=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "RELEASE_VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: BraveOriginFree v${{ env.RELEASE_VERSION }}
          body: |
            BraveOriginFree v${{ env.RELEASE_VERSION }}

            Brave Origin for Windows - Free. No purchase required.

            - Official Brave Origin binary (signed, SHA256 and signature verified)
            - Free activation bypass applied to a local profile on first install
            - Shared launch configuration for optional Brave features; behavior depends on the Brave version
            - Portable - no install, no admin

            1. Download the ZIP
            2. Extract anywhere
            3. Run install.bat (first time), then Launch.vbs or the desktop shortcut for console-free startup
            4. Optional: MakeDefault.bat registers it as a default browser candidate
          files: ${{ env.PACKAGE_PATH }}
